<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121B2E"/>
      <stop offset="1" stop-color="#05070E"/>
    </linearGradient>
    <linearGradient id="curva" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fundo)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2"/>
  <!-- barras de fundo: aportes crescendo -->
  <rect x="12" y="41" width="8" height="11" rx="2" fill="#22D3EE" fill-opacity="0.28"/>
  <rect x="24" y="35" width="8" height="17" rx="2" fill="#22D3EE" fill-opacity="0.28"/>
  <rect x="36" y="27" width="8" height="25" rx="2" fill="#22D3EE" fill-opacity="0.28"/>
  <!-- curva exponencial dos juros compostos -->
  <path d="M10 50 C 26 49, 36 43, 43 31 S 51 17, 55 11" fill="none" stroke="url(#curva)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="55" cy="11" r="9" fill="url(#brilho)"/>
  <circle cx="55" cy="11" r="4.5" fill="#E6FBFF"/>
</svg>
